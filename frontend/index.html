<!doctype html>
<html lang="en">

<head>
  <script>
    (function() {
      if (typeof navigator !== 'undefined' && !navigator.serviceWorker) {
        try {
          Object.defineProperty(navigator, 'serviceWorker', {
            configurable: true,
            enumerable: true,
            value: {
              register: function() { return Promise.reject("Mock SW"); },
              addEventListener: function() {},
              removeEventListener: function() {},
              ready: new Promise(function(res) { res({}); }),
              getRegistration: function() { return Promise.resolve(null); },
              getRegistrations: function() { return Promise.resolve([]); }
            }
          });
        } catch (e) { console.warn(e); }
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <!-- One font for every panel (Inter); Hindi and other scripts fall back to Noto / the system font -->

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/favicon.png" />

</head>
